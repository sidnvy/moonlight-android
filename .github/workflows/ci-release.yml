name: CI and Release

on:
  push:
    branches:
      - work/main
    tags:
      - "v*"
  pull_request:
    branches:
      - work/main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Run unit tests
        run: ./gradlew --no-daemon testNonRoot_gameDebugUnitTest --tests "com.limelight.binding.video.*"

      - name: Build Debug APKs
        run: |
          ./gradlew --no-daemon assembleNonRoot_gameDebug
          mkdir -p dist/debug
          cp app/build/outputs/apk/nonRoot_game/debug/*.apk dist/debug/

      - name: Build and verify signed Release APKs
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleNonRoot_gameRelease
          mkdir -p dist/release
          cp app/build/outputs/apk/nonRoot_game/release/*.apk dist/release/
          for apk in dist/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          done

      - name: Clean up release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-android-debug
          path: dist/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APKs
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-android-release
          path: dist/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
